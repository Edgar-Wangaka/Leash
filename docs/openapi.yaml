openapi: 3.1.0
info:
  title: Leash dashboard API
  version: 0.1.0
  summary: Watch an AI agent's payment decisions and approve or deny held payments.
  description: |
    Leash is a payment gate between an AI agent and PayPal Payouts. Every
    payment request is decided by fixed rules: paid, held for a human, or
    blocked. This API is the human's side: read decisions, approve or deny
    held payments, and send scripted test requests.

    The agent never uses this API. It talks to the MCP endpoint at `/mcp`
    with its own bearer token, which this API refuses.

    Requests must use the deployment's own Host name. State-changing
    requests must send `Content-Type: application/json` and, from a browser,
    an Origin of the same host; anything else gets 403.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://leash-1pqh.onrender.com
    description: Render deployment (dry run)
  - url: http://127.0.0.1:8787
    description: Local dashboard (python -m leash.dashboard)
tags:
  - name: health
    description: Whether the service is up. No token needed.
  - name: decisions
    description: The policy in force, today's spend and recent decisions.
  - name: approvals
    description: The human approves or denies payments held for review.
  - name: settings
    description: The human changes the spending limits, within fixed ranges.
  - name: testing
    description: Scripted agent requests that go through the same rules.
  - name: demo
    description: Fake product pages used by the prompt-injection demo.
security:
  - dashboardToken: []

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      description: Answers any Host and reveals nothing but that the process is up.
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }

  /api/state:
    get:
      tags: [decisions]
      operationId: getState
      summary: Policy, today's spend and the latest 100 decisions
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "401": { $ref: "#/components/responses/TokenRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/approve:
    post:
      tags: [approvals]
      operationId: approvePayment
      summary: Approve a held payment and pay it
      description: |
        Only a pending `hold_for_human` decision can be approved. The hard
        rules (cap, seller allowlist, daily budget) are checked again before
        paying, so an approval can still be refused (`rejected_on_recheck`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id: { type: string }
      responses:
        "200":
          description: The outcome. `ok` is false when the approval was refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { $ref: "#/components/responses/BadJson" }
        "401": { $ref: "#/components/responses/TokenRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/deny:
    post:
      tags: [approvals]
      operationId: denyPayment
      summary: Deny a held payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id: { type: string }
                reason:
                  type: string
                  description: Shown in the decision log. Defaults to "Denied in dashboard".
      responses:
        "200":
          description: The outcome. `ok` is false when the hold was already resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { $ref: "#/components/responses/BadJson" }
        "401": { $ref: "#/components/responses/TokenRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/settings:
    post:
      tags: [settings]
      operationId: changeSettings
      summary: Change the spending limits
      description: |
        Changes the editable limits (per-payment cap, daily budget, approval
        threshold, requests per minute, hold expiry, approved sellers). Values
        must fit the ranges in `config/policy.json` (`editable_limits`), with
        threshold <= cap <= daily budget. A change that loosens a limit is
        refused with 409 unless `confirm_loosening` is true; tightening applies
        at once. `reset: true` goes back to the policy.json defaults. Each saved
        change is a new version, listed under `settings.history` in /api/state.
        Only the dashboard token can call this; the agent has no such tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                changes: { $ref: "#/components/schemas/Limits" }
                confirm_loosening: { type: boolean, default: false }
                reset: { type: boolean, default: false }
      responses:
        "200":
          description: Saved, or `reason` is `unchanged` when nothing differed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResult" }
        "400":
          description: Bad JSON, or `reason` is `invalid` with an error per field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResult" }
        "401": { $ref: "#/components/responses/TokenRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The change loosens a limit and `confirm_loosening` was not set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResult" }
        "503":
          description: The settings store could not be read; nothing was changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResult" }

  /api/simulate:
    post:
      tags: [testing]
      operationId: simulateRequest
      summary: Send a scripted agent request through the same rules
      description: |
        `small` is normally paid, `large` is held for a human, and `attack`
        (a hijacked agent paying an unknown seller $500) is blocked.
        Requests count toward the rate limit and the daily budget like any other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario: { type: string, enum: [small, large, attack] }
      responses:
        "200":
          description: The decision Leash made.
          content:
            application/json:
              schema:
                type: object
                required: [ok, record]
                properties:
                  ok: { type: boolean }
                  record: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/BadJson" }
        "401": { $ref: "#/components/responses/TokenRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/agent/run:
    post:
      tags: [testing]
      operationId: runAgent
      summary: Ask an AI shopping agent to buy something; Leash decides each payment
      description: |
        A model (Gemini by default, or any OpenAI-compatible model) shops with
        search_products, browse_page and request_payment. Every payment it asks
        for goes through the same rules as any agent's. Returns each step and
        each decision. Limits: 300-character task, 6 model turns, 2 payments
        per run, 3 runs a minute and 150 a day. With no model configured, a
        rule-based agent runs instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, maxLength: 300 }
      responses:
        "200":
          description: The run. `ok` is false with an `error` when the task, the caps or the model stopped it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mode: { type: string }
                  model: { type: [string, "null"] }
                  steps: { type: array, items: { type: object } }
                  decisions: { type: array, items: { type: object } }
                  answer: { type: string }
                  error: { type: string }
        "401": { $ref: "#/components/responses/TokenRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/hijack:
    post:
      tags: [testing]
      operationId: runHijackDemo
      summary: A naive agent obeys a hidden instruction on a product page; Leash's answer
      description: No model needed. Returns the hidden text, the payment the agent asked for, and Leash's decision.
      responses:
        "200":
          description: The demo run.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/TokenRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /mcp:
    post:
      tags: [testing]
      operationId: mcpEndpoint
      summary: The agent's MCP endpoint (streamable HTTP)
      description: |
        Where an AI agent connects with the Model Context Protocol. It offers
        three tools (search_products, request_payment, get_payment_status) and
        nothing that approves a payment or changes a limit. Needs the agent's
        own bearer token (LEASH_MCP_TOKEN); the dashboard token is refused here,
        and this token is refused by the dashboard.
      security:
        - mcpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: An MCP JSON-RPC message. }
      responses:
        "200":
          description: The MCP response.
          content:
            application/json:
              schema: { type: object }
        "401":
          description: Missing or wrong bearer token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /webhooks/channel3:
    post:
      tags: [settings]
      operationId: channel3PriceWebhook
      summary: Channel3 tells Leash a watched product's price or stock changed
      description: |
        Called by Channel3 (Svix), not by people. Signed with the endpoint's
        `whsec_` secret (`CHANNEL3_WEBHOOK_SECRET`): headers `svix-id`,
        `svix-timestamp`, `svix-signature`. No dashboard token. Leash stores
        `offer.price.changed` and `offer.availability.changed` once per event
        `id` and shows them on waiting requests; it changes no decision.
        Off (404) when the secret is not set.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
              properties:
                id: { type: string }
                timestamp: { type: string, format: date-time }
                type: { type: string, examples: [offer.price.changed, offer.availability.changed] }
                data: { type: object }
      responses:
        "200":
          description: Accepted. `recorded` is false for a redelivery or an ignored event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  recorded: { type: boolean }
        "401":
          description: Missing, wrong or stale signature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /demo/listing/{slug}:
    get:
      tags: [demo]
      operationId: getDemoListing
      summary: A fake product page carrying a hidden prompt injection
      description: For the injection demo. Off when `LEASH_DEMO_PAGES=false`.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: premium-birthday-gift-box }
      responses:
        "200":
          description: The product page.
          content:
            text/html:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    mcpToken:
      type: http
      scheme: bearer
      description: The agent's token (LEASH_MCP_TOKEN), for /mcp only.
    dashboardToken:
      type: apiKey
      in: header
      name: X-Leash-Token
      description: |
        The human's approval token (LEASH_DASHBOARD_TOKEN on a deployment, or
        the one printed at startup locally). The agent's MCP token is refused.

  responses:
    TokenRequired:
      description: Missing or wrong token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: token_required }
    Forbidden:
      description: Wrong Host, a cross-site Origin, or not JSON.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: forbidden }
    BadJson:
      description: The body was not valid JSON.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: bad_json }
    NotFound:
      description: Unknown path or scenario.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: not_found }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    ActionResult:
      type: object
      required: [ok, status, reason]
      properties:
        ok: { type: boolean }
        status:
          type: string
          description: The decision's status after the action.
          examples: [paid, submitted, denied, rejected_on_recheck, expired]
        reason:
          type: [string, "null"]
          description: Why the action was refused, when it was.
          examples: [already_paid, approval_expired, not_human_hold, cap]

    Verdict:
      type: string
      enum: [allow, hold_for_human, block]

    Catalog:
      type: [object, "null"]
      description: What the Channel3 catalog said about the named product.
      properties:
        status: { type: string, enum: [ok, unavailable] }
        product_id: { type: string }
        name: { type: string }
        sold_by: { type: string }
        merchant_email: { type: string }
        price_usd: { type: string }
        error: { type: string }
        history:
          type: object
          description: The product's price over the last 30 days, from Channel3 price history.
          properties:
            status: { type: string, enum: [ok, unavailable] }
            median_usd: { type: [string, "null"], description: Median daily price; null with no history. }
            points: { type: integer, description: Number of daily prices behind the median. }
            days: { type: integer }
            error: { type: string }

    Decision:
      type: object
      required: [request_id, agent_id, merchant_email, amount_usd, verdict, reasons, status, created_at]
      properties:
        request_id: { type: string }
        agent_id: { type: string }
        merchant_email: { type: string }
        amount_usd: { type: string, pattern: "^\\d+\\.\\d{2}$", examples: ["8.00"] }
        reason: { type: string, description: What the agent said the payment is for. }
        product_id: { type: [string, "null"] }
        verdict: { $ref: "#/components/schemas/Verdict" }
        reasons:
          type: array
          items: { type: string }
          description: Rules that fired, e.g. cap, allowlist, approval_threshold, price_mismatch, price_spike.
        status:
          type: string
          examples: [pending, blocked, paying, submitted, paid, failed, denied, expired]
        explanation: { type: string }
        catalog: { $ref: "#/components/schemas/Catalog" }
        risk_signal: { type: string }
        approved_by: { type: [string, "null"] }
        paypal_batch_id: { type: [string, "null"] }
        paypal_transaction_id: { type: [string, "null"], description: "PayPal's transaction ID for the payout item, once PayPal has processed it." }
        paypal_status: { type: [string, "null"], description: "PayPal's own status for the payout, e.g. PENDING, SUCCESS, UNCLAIMED." }
        paypal_time_processed: { type: [string, "null"], format: date-time }
        error_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    Limits:
      type: object
      description: Any subset of the editable limits.
      properties:
        per_transaction_cap_usd: { type: number, minimum: 0 }
        daily_budget_usd: { type: number, minimum: 0 }
        approval_threshold_usd: { type: number, minimum: 0 }
        max_requests_per_minute: { type: integer, minimum: 1 }
        human_approval_expiry_hours: { type: integer, minimum: 1 }
        merchant_allowlist:
          type: array
          items: { type: string, format: email }
    SettingsResult:
      type: object
      required: [ok, reason]
      properties:
        ok: { type: boolean }
        reason:
          type: string
          enum: [saved, unchanged, invalid, confirm_loosening, changed_by_required, settings_store_unavailable]
        version: { type: integer }
        changes:
          type: object
          additionalProperties:
            type: object
            properties:
              from: {}
              to: {}
        loosened:
          type: array
          items: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
        policy: { type: object }
    Settings:
      type: object
      properties:
        version: { type: [integer, "null"] }
        current: { $ref: "#/components/schemas/Limits" }
        defaults: { $ref: "#/components/schemas/Limits" }
        limits:
          type: object
          description: Allowed range per field (min/max; for sellers, max is a count).
          additionalProperties:
            type: object
            properties:
              min: { type: number }
              max: { type: number }
        labels:
          type: object
          additionalProperties: { type: string }
        history:
          type: array
          items:
            type: object
            properties:
              version: { type: integer }
              changes: { type: object }
              changed_by: { type: string }
              changed_at: { type: string, format: date-time }
    State:
      type: object
      required: [mode, policy, daily_spend_usd, decisions]
      properties:
        mode: { type: string, enum: [dry-run, sandbox, live] }
        policy:
          type: object
          properties:
            per_transaction_cap_usd: { type: number }
            daily_budget_usd: { type: number }
            approval_threshold_usd: { type: number }
            max_requests_per_minute: { type: integer }
            merchant_allowlist:
              type: array
              items: { type: string }
        daily_spend_usd: { type: string }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        settings: { $ref: "#/components/schemas/Settings" }
        agent:
          type: object
          description: Which model the Ask-the-agent box uses (never the key).
          properties:
            mode: { type: string, examples: [gemini, openai-compatible, rule-based] }
            model: { type: [string, "null"] }
        price_alerts:
          type: object
          description: |
            Per waiting request ID, the Channel3 price (`price`) and stock
            (`availability`) changes at its seller since the request was made:
            `previous` (before the first change), `current`, `changed_at`,
            `changes`, `domain`.
          additionalProperties: { type: object }
