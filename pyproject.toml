[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paypal-payouts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "mcp>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pyyaml>=6",
]
# Each integration is optional and does nothing until its env var is set.
remote = [
    "uvicorn>=0.30",
    "starlette>=0.37",
]
kernel = [
    "kernel",
    "playwright>=1.44",
]
# Keeps dashboard limit changes in a hosted Postgres (e.g. Neon's free tier).
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leash = ["*.html"]
